services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot job: downloads the model into the shared volume (~5GB on first run).
  model-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen3:1.7b"]
    restart: "no"

  app:
    build: .
    depends_on:
      model-pull:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: http://ollama:11434
    # The app is an interactive prompt loop.
    stdin_open: true
    tty: true

  # Jupyter server for notebook.ipynb; open http://localhost:8888
  notebook:
    build: .
    command:
      - jupyter
      - notebook
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --IdentityProvider.token=
    ports:
      # Bound to localhost only, since the token is disabled.
      - "127.0.0.1:8888:8888"
    # Run as your own user so files saved from Jupyter aren't owned by root.
    # Set UID/GID in a .env file if yours aren't 1000.
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Edits made in Jupyter are saved straight to your working copy.
      - .:/app
    depends_on:
      - ollama

volumes:
  ollama:
